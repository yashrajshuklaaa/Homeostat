apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homeostat-controller
rules:
  - apiGroups: ["homeostat.dev"]
    resources: ["homeostatrecommendations"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["homeostat.dev"]
    resources: ["homeostatrecommendations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homeostat-controller
  namespace: homeostat-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homeostat-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homeostat-controller
subjects:
  - kind: ServiceAccount
    name: homeostat-controller
    namespace: homeostat-system
